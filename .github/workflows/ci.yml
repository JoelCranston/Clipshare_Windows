name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/OmaclipCore.Tests --nologo

  interop:
    name: Interop with omaclip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/interop/omaclip-peer/go.mod
          cache: false
      - run: tests/interop/run.sh

  build:
    name: Build ClipShare.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish x64
        run: ./scripts/publish.ps1 -Arch x64 -Version 0.0.1
        shell: pwsh
      - name: Publish arm64
        run: ./scripts/publish.ps1 -Arch arm64
        shell: pwsh
      - name: Smoke test (starts, stays up, opens Settings, logs no errors)
        shell: pwsh
        run: |
          $app = Start-Process publish/win-x64/ClipShare.exe -PassThru
          Start-Sleep -Seconds 15
          $app.Refresh()
          if ($app.HasExited) { throw "ClipShare exited with code $($app.ExitCode)" }
          $log = Join-Path $env:LOCALAPPDATA "ClipShare\errors.log"
          if (Test-Path $log) { Get-Content $log; throw "ClipShare logged errors" }
          Write-Host "Main window: '$($app.MainWindowTitle)'"
          if ($app.MainWindowTitle -ne "ClipShare Settings") { throw "Settings did not open on first launch" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@v4
        with:
          name: ClipShare-win-x64
          path: publish/win-x64/ClipShare.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ClipShare-win-arm64
          path: publish/win-arm64/ClipShare.exe
